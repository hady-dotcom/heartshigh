# Fly alternative. Replace the app name, then `fly launch` will use the Dockerfile in this folder.
# Set secrets with `fly secrets set`. Do not put passwords in this file.
# Fly sets Fly-Client-IP itself; the app reads it when FLY_APP_NAME is present.
app = "hearts"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
